<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost & Found Community - User Registration (Person 1)</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="app-container">
    <div class="glass-card">

      <!-- Header Section -->
      <div class="brand-header">
        <div class="brand-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Verification Portal
        </div>
        <h1>Join the Community</h1>
        <p>Create your account and upload your ID proof for verification.</p>
        <div id="apiModeBadge" style="font-size: 0.75rem; margin-top: 0.5rem; font-weight: 600;"></div>
      </div>

      <!-- Notification Alerts -->
      <div id="alertBox" class="alert-box">
        <span id="alertIcon"></span>
        <span id="alertMessage"></span>
      </div>

      <!-- Registration Form -->
      <form id="registrationForm" class="registration-form" novalidate>
        
        <!-- Full Name -->
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="fullName" class="input-control" placeholder="full name" required>
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>

        <div class="form-grid">
          <!-- Email -->
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <input type="email" id="email" class="input-control" placeholder="mail@example.com" required>
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <div class="input-wrapper">
              <input type="tel" id="phone" class="input-control" placeholder="+91 XXXXX-XXXXX" required>
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
            </div>
          </div>
        </div>

        <div class="form-grid">
          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="password" class="input-control" placeholder="********" required>
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <div class="password-strength">
              <div id="strengthMeter" class="strength-meter"></div>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" class="input-control" placeholder="********" required>
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- ID Document Photo Upload -->
        <div class="form-group">
          <label>ID Document / Proof Photo <span>(Required for Admin Approval)</span></label>
          <div id="dropzone" class="file-dropzone">
            <input type="file" id="idProofInput" accept="image/png, image/jpeg">
            <div class="dropzone-content">
              <div class="dropzone-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
              </div>
              <span class="dropzone-title">Click to upload or drag & drop</span>
              <span class="dropzone-subtitle">PNG and JPG (Max 5MB)</span>
            </div>
          </div>

          <!-- File Selected Preview Box -->
          <div id="filePreview" class="file-preview">
            <img id="previewImage" src="" alt="ID Preview">
            <div class="file-info">
              <div id="previewName" class="file-name">filename.jpg</div>
              <div id="previewSize" class="file-size">1.2 MB</div>
            </div>
            <button type="button" id="btnRemoveFile" class="btn-remove-file" title="Remove File">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <!-- Axios Upload Progress Bar -->
          <div id="uploadProgress" class="upload-progress-container">
            <div class="upload-text">
              <span>Sending Payload & Uploading ID Photo...</span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="upload-progress-bar">
              <div id="progressFill" class="upload-progress-fill"></div>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnSubmit" class="btn-submit">
          <span id="btnText">Register & Submit for Verification</span>
          <div id="btnSpinner" class="spinner" style="display: none;"></div>
        </button>

      </form>

      <div class="footer-note">
        Person 1 Client UI • Axios REST API Integration
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
